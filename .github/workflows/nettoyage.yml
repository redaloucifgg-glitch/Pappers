name: Nettoyer agences

on:
  workflow_dispatch:
    inputs:
      deps:
        description: "Départements de l'échantillon test (ex. 75,06,13). Vide = pas d'échantillon"
        required: false
        default: "75,06,13"
      n:
        description: "Taille de l'échantillon (répartie à égalité entre départements)"
        required: false
        default: "1000"
      seuil:
        description: "Un nom présent N fois ou plus est listé à vérifier"
        required: false
        default: "5"

permissions:
  contents: write

# même groupe que sirene.yml : pas de nettoyage pendant une récupération
concurrency:
  group: sirene
  cancel-in-progress: false

jobs:
  nettoyage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nettoyer
        env:
          DEPS: ${{ github.event.inputs.deps }}
          N: ${{ github.event.inputs.n }}
          SEUIL: ${{ github.event.inputs.seuil }}
        run: |
          ARGS="--seuil $SEUIL --n $N"
          if [ -n "$DEPS" ]; then ARGS="$ARGS --deps $DEPS"; fi
          python nettoyer_agences.py $ARGS
      - name: Résumé dans l'onglet du workflow
        run: cat rapports/nettoyage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit des résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rapports/ export/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Nettoyage des agences"
          for i in 1 2 3 4; do
            git push && exit 0
            git pull --rebase
            sleep $((2 * i))
          done
          exit 1
